    <div class="public-audit-details" id="audit-included">
      <div class="sec-head"><div><h3>Everything included in your public audit</h3><p class="muted">Live observations from our own crawl engine, with the scope of every measurement explained.</p></div></div>
      <div class="public-audit-features"><article><span class="public-audit-feature-icon"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span><h4>Technical &amp; on-page SEO</h4><p>Review HTTP responses, redirects, indexing rules, sitemaps, titles, descriptions, headings, canonical URLs and duplicate source content.</p></article><article><span class="public-audit-feature-icon"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg></span><h4>Competitor benchmarks</h4><p>Compare your website with up to two competitors using the same checks and page limit. See coverage, errors, warnings and response timings side by side.</p></article><article><span class="public-audit-feature-icon"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8ZM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8Z"/></svg></span><h4>Content opportunities</h4><p>Explore terms observed in page text, their occurrences and title or heading matches. Find competitor topics absent from your sampled pages, with source links.</p></article><article><span class="public-audit-feature-icon"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg></span><h4>Observed link evidence</h4><p>Inspect incoming internal links and cross-domain links found among the crawled websites. Review referring pages, destinations, anchor text and observation times.</p></article><article><span class="public-audit-feature-icon"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01M9 17h6"/></svg></span><h4>Search &amp; AI crawler access</h4><p>Check robots.txt rules for Googlebot and AI crawlers, plus language declarations, hreflang links, JSON-LD syntax and social preview metadata.</p></article><article><span class="public-audit-feature-icon"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7Z"/></svg></span><h4>Performance observations</h4><p>Review response-to-header timings, HTML size, image dimensions and missing alt attributes. Sample up to eight same-site resource responses per website.</p></article><article><span class="public-audit-feature-icon"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2Z"/><path d="M9 8h6M9 12h6"/></svg></span><h4>Prioritized PDF reports</h4><p>Get a calculated audit health score, grouped checks, error and warning filters, recommended fixes, page inventories and a downloadable competitor report.</p></article><article><span class="public-audit-feature-icon"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg></span><h4>Reports you can revisit</h4><p>Open recent reports from the same browser or share a report link. Reports are available for 24 hours, with measurement times and crawl coverage included.</p></article></div>

    <div class="public-audit-faq"><h3>Before you start</h3><div><details><summary>Do I need an account or an SEO subscription?</summary><p>No sign-in or external SEO subscription is required. Vintorex runs its own crawler, content and link analysis, report storage and PDF generation.</p></details><details><summary>How much of my website will be checked?</summary><p>Choose a sample of 10, 25 or 40 pages for each website. Each domain has a 90-second crawl budget, and robots.txt rules are respected. The report shows how many URLs were discovered and evaluated, including partial coverage.</p></details><details><summary>What does the audit health score measure?</summary><p>The score summarizes observed checks using severity weights of 5 for errors, 2 for warnings and 1 for notices. Each finding includes its evidence and a recommended action. Editorial thresholds identify items worth reviewing.</p></details><details><summary>Which measurements need further testing?</summary><p>The audit reads public HTTP responses and source HTML. JavaScript-only content may be absent. Search traffic, keyword search volumes, Google positions, real-user Core Web Vitals and web-wide backlink totals require separate direct measurements.</p></details><details><summary>What does the PDF include?</summary><p>The PDF includes an executive summary, competitor benchmarks, prioritized actions, thematic checks, crawler access rules, observed content terms, cross-domain link evidence and crawled URL inventories.</p></details><details><summary>How fresh are the results?</summary><p>Every report includes observation times. Matching audit requests can reuse the same report for ten minutes. Use Run again to request a fresh scan after making changes.</p></details><details><summary>Who can view my report?</summary><p>Anyone with the report link can view it during its 24-hour availability period. Your recent-report list is saved in your browser.</p></details></div></div>
